name: Diag jump3r API
on:
  push:
    branches: ["diag/jump3r"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Download jump3r
        run: |
          set -eux
          mkdir -p diag-out/jars
          base=https://repo1.maven.org/maven2/de/sciss/jump3r
          curl -fsSL "$base/maven-metadata.xml" -o diag-out/maven-metadata.xml
          ver=$(sed -n 's:.*<release>\(.*\)</release>.*:\1:p' diag-out/maven-metadata.xml)
          echo "$ver" > diag-out/version.txt
          curl -fsSL "$base/$ver/jump3r-$ver.jar" -o diag-out/jars/jump3r.jar
          curl -fsSL "$base/$ver/jump3r-$ver-sources.jar" -o diag-out/jars/jump3r-sources.jar || true
          curl -fsSL "$base/$ver/jump3r-$ver.pom" -o diag-out/jump3r.pom || true
          unzip -l diag-out/jars/jump3r.jar > diag-out/classes.txt
          mkdir -p diag-out/src && (cd diag-out/src && unzip -q ../jars/jump3r-sources.jar) || true
          # javax.sound usage
          grep -rl "javax.sound" diag-out/src > diag-out/javax-sound-users.txt || true
          for c in de.sciss.jump3r.lowlevel.LameEncoder de.sciss.jump3r.mp3.Lame de.sciss.jump3r.mp3.LameGlobalFlags; do
            javap -cp diag-out/jars/jump3r.jar -public "$c" >> diag-out/javap.txt 2>&1 || true
          done
          rm -rf diag-out/jars
      - name: Commit result
        run: |
          git config user.name "track-catcher-ci"
          git config user.email "ci@users.noreply.github.com"
          git add diag-out
          git commit -m "diag: jump3r API dump"
          git push origin HEAD:diag/jump3r-out --force
